<!doctype html>
<!-- Tout le contenu du site est en français : le déclarer ici oriente le
     ciblage des recherches francophones et permet aux lecteurs d'écran
     d'utiliser la bonne prononciation. -->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Ambassadeurs Pour Christ (A.P.C) — Église chrétienne</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Église Les Ambassadeurs Pour Christ (A.P.C) : cultes, enseignements, programmes et Rassemblement des Aigles (RDA). Siège à Kinshasa et extensions dans plusieurs pays."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#1c1c8c" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Supabase sert les données et les images : ouvrir la connexion au plus
         tôt évite d'attendre la négociation TLS au moment du premier appel. -->
    <link rel="preconnect" href="https://frcatxbhpwtkqroumqrp.supabase.co" />
    <link rel="dns-prefetch" href="https://frcatxbhpwtkqroumqrp.supabase.co" />
    <!-- L'accueil animé ne se joue qu'une fois par visite. Ce script pose la
         marque AVANT le premier rendu : posée plus tard par l'application,
         l'animation aurait déjà commencé et sauterait à sa fin. Enveloppé
         d'un try : sessionStorage peut être inaccessible (navigation privée
         stricte), et l'animation se joue alors simplement à chaque fois. -->
    <script>
      try {
        if (sessionStorage.getItem('apc-intro-played')) {
          document.documentElement.classList.add('apc-intro-played');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
