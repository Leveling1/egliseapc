<footer class="apc-footer">
  <span class="apc-footer__watermark" aria-hidden="true">APC</span>

  <div class="apc-footer__inner">
    <div class="apc-footer__brand">
      <img src="/images/home/logo-apc.png" alt="" width="40" height="40" class="apc-footer__logo" />
      <span class="apc-footer__wordmark">A.P.C</span>
    </div>

    <p class="apc-footer__tagline"><span aria-hidden="true">•</span>SAINTÉTÉ À L'ÉTERNEL<span aria-hidden="true">•</span></p>

    <nav class="apc-footer__nav" aria-label="Navigation du pied de page">
      <a routerLink="/" class="apc-footer__link">Accueil</a>
      <a routerLink="/nos-cultes" class="apc-footer__link">Nos Cultes</a>
      <a routerLink="/rda" class="apc-footer__link">RDA</a>
      <a routerLink="/a-propos" class="apc-footer__link">À propos</a>
      @if (showResources()) {
        <a routerLink="/ressources" class="apc-footer__link">Ressources</a>
      }
      <a routerLink="/blog" class="apc-footer__link">Blog</a>
    </nav>

    <div class="apc-footer__socials">
      <a
        href="https://www.facebook.com/egliseapc"
        class="apc-footer__social"
        aria-label="Facebook"
        target="_blank"
        rel="noopener"
      >
        <img src="/icons/facebook.svg" alt="" class="apc-footer__social-icon" />
      </a>
      <a
        href="https://www.youtube.com/@apc-kinshasa"
        class="apc-footer__social"
        aria-label="YouTube"
        target="_blank"
        rel="noopener"
      >
        <img src="/icons/youtube.svg" alt="" class="apc-footer__social-icon" />
      </a>
      <a
        href="https://www.instagram.com/egliseapc?igsh=MXZ6eTd6YnNpdjl5bg=="
        class="apc-footer__social"
        aria-label="Instagram"
        target="_blank"
        rel="noopener"
      >
        <img src="/icons/instagram.svg" alt="" class="apc-footer__social-icon" />
      </a>
    </div>

    <div class="apc-footer__contact">
      <span>+243 892 211 899</span>
      <span aria-hidden="true">·</span>
      <span>+243 812 277 291</span>
      <span aria-hidden="true">·</span>
      <span>Av. Luzandi n°05, Q/Pigeon, C/Ngaliema</span>
    </div>

    <div class="apc-footer__copyright">
      <span>© {{ year }} Ambassadeurs Pour Christ. Tous droits réservés</span>
    </div>
  </div>
</footer>
