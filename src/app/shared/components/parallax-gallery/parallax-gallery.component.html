<div class="apc-wall">
  <!-- L'en-tête est projeté : le mur fournit le mouvement, la page les mots. -->
  <div class="apc-wall__header">
    <ng-content />
  </div>

  <div class="apc-wall__grid">
    @for (column of columns(); track $index) {
      <div class="apc-wall__column">
        @for (photo of column; track photo.src) {
          <figure class="apc-wall__card">
            <img
              class="apc-wall__image"
              [src]="photo.src"
              [alt]="photo.alt ?? ''"
              [width]="photo.width"
              [height]="photo.height"
              loading="lazy"
              decoding="async"
            />
            @if (photo.caption) {
              <figcaption class="apc-wall__caption">{{ photo.caption }}</figcaption>
            }
          </figure>
        }
      </div>
    }
  </div>
</div>
