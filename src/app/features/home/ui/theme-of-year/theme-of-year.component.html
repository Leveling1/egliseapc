@if (oracle(); as current) {
<section class="apc-theme" aria-label="Thème de l'année">
  <div class="apc-theme__background" role="img" [attr.aria-label]="'Illustration du thème ' + current.title"></div>
  <div class="apc-theme__overlay"></div>

  <div class="apc-theme__content">
    <span class="apc-theme__overline">Oracle {{ current.year }}</span>
    <h2 class="apc-theme__title">{{ current.title }}</h2>
    @if (current.verse_text) {
      <p class="apc-theme__quote">« {{ current.verse_text }} »</p>
    }
    @if (current.verse_reference) {
      <span class="apc-theme__reference">{{ current.verse_reference }}</span>
    }
  </div>
</section>
}
