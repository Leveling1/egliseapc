<div class="cp-media">
  <span class="cp-media__label">{{ label() }}</span>

  <div
    class="cp-media__drop"
    [class.cp-media__drop--busy]="uploading()"
    (drop)="onDrop($event)"
    (dragover)="allowDrop($event)"
  >
    @if (hasImage()) {
      <img [src]="value()" alt="" class="cp-media__preview" />
    } @else {
      <p class="cp-media__hint">Glissez une image ici, ou choisissez un fichier.</p>
    }

    <div class="cp-media__actions">
      <button type="button" class="cp-media__button" (click)="pick()" [disabled]="uploading()">
        {{ uploading() ? 'Envoi…' : hasImage() ? 'Remplacer' : 'Choisir une image' }}
      </button>

      @if (hasImage() && !uploading()) {
        <button type="button" class="cp-media__button cp-media__button--ghost" (click)="clear()">
          Retirer
        </button>
      }
    </div>
  </div>

  @if (recommended()) {
    <p class="cp-media__note">Recommandé : {{ recommended() }}</p>
  }

  @if (error()) {
    <p class="cp-media__error">{{ error() }}</p>
  }

  <input
    #file
    type="file"
    accept="image/jpeg,image/png"
    class="cp-media__input"
    (change)="onSelect($event)"
  />
</div>
