<app-header variant="light" />

<main>
  <app-blog-hero />
  @if (featured(); as article) {
    <app-featured-article [article]="article" />
  }

  @if (showFilters()) {
    <div class="apc-blog-filters">
      <app-filter-bar
        [filters]="categories()"
        searchPlaceholder="Rechercher…"
        (filterChange)="onCategoryChange($event)"
      />
    </div>
  }

  <div class="apc-blog-grid-wrap">
    <div class="apc-blog-grid">
      @for (article of articles(); track article.slug) {
        <app-article-card
          [slug]="article.slug"
          [category]="article.category"
          [background]="article.background"
          [title]="article.title"
          [excerpt]="article.excerpt"
          [date]="article.date"
        />
      }
    </div>

    <app-pagination [currentPage]="currentPage()" [totalPages]="3" (pageChange)="onPageChange($event)" />
  </div>
</main>

<app-footer />
