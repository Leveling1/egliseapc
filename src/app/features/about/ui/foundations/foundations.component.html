<section
  class="apc-found"
  [class.apc-found--pinned]="pinned()"
  [style.height]="pinned() ? pinHeight : null"
  aria-labelledby="apc-found-title"
>
  <h2 id="apc-found-title" class="apc-found__sr">Nos fondements</h2>

  <div class="apc-found__stage">
    @for (panel of panels; track panel.id; let index = $index) {
      <!-- Chaque partie porte sa photo, son voile et son texte. Empilées
           l'une sous l'autre par défaut ; superposées et fondues une fois la
           section épinglée. -->
      <article
        class="apc-found__panel"
        [id]="'fondement-' + panel.id"
        [attr.aria-hidden]="pinned() && active() !== index ? true : null"
      >
        <div class="apc-found__photo" aria-hidden="true">
          <img
            [src]="panel.image"
            alt=""
            width="1280"
            height="854"
            [attr.loading]="index === 0 ? 'eager' : 'lazy'"
            decoding="async"
            class="apc-found__img"
          />
        </div>

        <div class="apc-found__content">
          <span class="apc-found__overline">Nos fondements</span>
          <h3 class="apc-found__title">{{ panel.title }}</h3>
          <p class="apc-found__text">{{ panel.description }}</p>
          @if (panel.items) {
            <ol class="apc-found__list">
              @for (item of panel.items; track item) {
                <li class="apc-found__item">{{ item }}</li>
              }
            </ol>
          }
        </div>
      </article>
    }

    <!-- Trois points : où l'on en est, et où aller. -->
    <nav class="apc-found__dots" aria-label="Parties de la section">
      @for (panel of panels; track panel.id; let index = $index) {
        <button
          type="button"
          class="apc-found__dot"
          [class.apc-found__dot--active]="active() === index"
          [attr.aria-current]="active() === index ? 'true' : null"
          [attr.aria-label]="panel.title"
          (click)="goTo(index)"
        ></button>
      }
    </nav>
  </div>
</section>
