<div class="apc-featured">
  <a
    class="apc-featured__card"
    [href]="href()"
    target="_blank"
    rel="noopener noreferrer"
    [attr.aria-label]="'Regarder sur YouTube : ' + title()"
  >
    <span class="apc-featured__thumb">
      @if (thumbnail(); as src) {
        <img [src]="src" alt="" class="apc-featured__img" fetchpriority="high" decoding="async" />
      }
      <span class="apc-featured__play" aria-hidden="true">
        <span class="apc-featured__play-icon"></span>
      </span>
    </span>
    <span class="apc-featured__tag">À la une</span>
    <span class="apc-featured__caption">
      <span class="apc-featured__title">{{ title() }}</span>
      <span class="apc-featured__meta">{{ meta() }}</span>
    </span>
  </a>
</div>
