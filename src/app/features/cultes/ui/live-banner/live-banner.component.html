@if (isLive()) {
  <div class="apc-live" role="status">
    <div class="apc-live__badge">
      <span class="apc-live__dot" aria-hidden="true"></span>
      <span class="apc-live__label">En direct</span>
    </div>
    <span class="apc-live__text">Culte en cours — Rejoignez-nous maintenant</span>
    <a href="#" class="apc-live__cta">Regarder le live →</a>
  </div>
  <div class="apc-live__note">
    <span>↑ Cette bannière n'apparaît que lorsqu'un culte est diffusé en direct sur YouTube</span>
  </div>
}
