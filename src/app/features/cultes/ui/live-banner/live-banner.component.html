@if (live(); as current) {
  <div class="apc-live" role="status">
    <div class="apc-live__badge">
      <span class="apc-live__dot" aria-hidden="true"></span>
      <span class="apc-live__label">En direct</span>
    </div>
    <span class="apc-live__text">{{ current.title }}</span>
    <a [href]="href()" target="_blank" rel="noopener noreferrer" class="apc-live__cta">
      Regarder le direct →
    </a>
  </div>
}
