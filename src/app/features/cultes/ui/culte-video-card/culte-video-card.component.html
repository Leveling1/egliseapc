<a
  class="apc-video-card"
  [href]="href()"
  target="_blank"
  rel="noopener noreferrer"
  [attr.aria-label]="'Regarder sur YouTube : ' + title()"
>
  <span class="apc-video-card__thumb">
    <img [src]="thumbnail()" alt="" class="apc-video-card__img" loading="lazy" decoding="async" />
    <span class="apc-video-card__play" aria-hidden="true">
      <span class="apc-video-card__play-icon"></span>
    </span>
    <span class="apc-video-card__duration">{{ duration() }}</span>
  </span>
  <span class="apc-video-card__body">
    <span class="apc-video-card__title">{{ title() }}</span>
    <span class="apc-video-card__date">{{ date() }}</span>
  </span>
</a>
